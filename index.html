<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Choice Quiz</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Main container for the entire quiz application -->
    <div class="container">

        <!-- Start Screen: Visible when the page first loads -->
        <div id="start-screen" class="screen">
            <h1 class="title">Web Dev Quiz</h1>
            <p class="subtitle">Test your knowledge with these questions!</p>
            <button id="start-btn" class="btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen: Hidden by default, shown when the quiz starts -->
        <div id="quiz-screen" class="screen hide">
            <div id="question-container">
                <!-- The question text will be inserted here by JavaScript -->
                <p id="question-text">Question goes here</p>
            </div>
            <!-- Container for the answer buttons -->
            <div id="answer-buttons" class="btn-grid">
                <!-- Answer buttons will be generated by JavaScript -->
            </div>
            <button id="next-btn" class="btn next-btn hide">Next</button>
        </div>

        <!-- Results Screen: Hidden by default, shown when the quiz ends -->
        <div id="results-screen" class="screen hide">
            <h2 class="title">Quiz Complete!</h2>
            <!-- The final score will be displayed here -->
            <p id="score-text" class="subtitle">Your score will appear here.</p>
            <button id="restart-btn" class="btn">Restart Quiz</button>
        </div>

    </div>

    <!-- Link to the external JavaScript file -->
    <!-- 'defer' ensures the script runs after the HTML is parsed -->
    <script src="script.js"></script>
</body>

</html>
